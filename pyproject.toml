[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrubbots-pixel-factory"
version = "0.1.0"
description = "Offline procedural pixel-art generator foundation for SCRUBBOTS."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary project code; third-party references are documented in THIRD_PARTY_NOTICES.md" }
authors = [{ name = "SCRUBBOTS" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"data/palette" = ["data/palette/scrubbots_palette_v2.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
